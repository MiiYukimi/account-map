<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f4eef8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="帳號地圖">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <title>帳號地圖</title>
  <style>
    :root{
      --bg:#f8f5fb; --card:#fff; --text:#2f2937; --muted:#847b90;
      --line:#e9e1ef; --accent:#7f67a8; --accent-soft:#efe9f7;
      --danger:#b75959; --shadow:0 10px 30px rgba(72,51,96,.08);
    }
    *{box-sizing:border-box}
    html{background:var(--bg)}
    body{
      margin:0; color:var(--text); background:var(--bg);
      font-family:system-ui,-apple-system,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
      min-height:100vh;
    }
    button,input,select,textarea{font:inherit}
    button{cursor:pointer}
    .app{max-width:780px;margin:auto;min-height:100vh;padding:24px 16px 100px}
    .top{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin:4px 2px 22px}
    h1{font-size:28px;margin:0 0 6px}
    .subtitle{color:var(--muted);font-size:14px;line-height:1.55}
    .install{display:none;border:0;background:var(--accent);color:white;border-radius:14px;padding:10px 14px}
    .card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:var(--shadow);margin-bottom:14px}
    .section-title{font-weight:700;font-size:16px;margin-bottom:12px}
    .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
    .stat{padding:15px;border-radius:16px;background:var(--accent-soft)}
    .stat b{display:block;font-size:24px;margin-bottom:2px}
    .stat span{font-size:12px;color:var(--muted)}
    .search{width:100%;border:1px solid var(--line);background:#fff;border-radius:14px;padding:12px 14px;outline:none}
    .search:focus,.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent)}
    .chips{display:flex;gap:8px;overflow:auto;padding:2px 0 4px;scrollbar-width:none}
    .chip{white-space:nowrap;border:1px solid var(--line);background:#fff;color:var(--text);padding:8px 11px;border-radius:999px}
    .chip.active{background:var(--accent);color:#fff;border-color:var(--accent)}
    .entry{display:flex;gap:12px;align-items:flex-start;padding:14px 0;border-bottom:1px solid var(--line)}
    .entry:last-child{border-bottom:0}
    .dot{width:12px;height:12px;border-radius:50%;background:var(--accent);margin-top:5px;flex:0 0 12px}
    .entry-main{flex:1;min-width:0}
    .entry-title{font-weight:700;word-break:break-word}
    .meta{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.5}
    .note{font-size:13px;margin-top:6px;line-height:1.5}
    .mini{border:0;background:var(--accent-soft);color:var(--accent);padding:7px 9px;border-radius:10px}
    .empty{text-align:center;color:var(--muted);padding:24px 8px}
    .fab{
      position:fixed;right:20px;bottom:78px;width:56px;height:56px;border-radius:50%;
      border:0;background:var(--accent);color:#fff;font-size:28px;box-shadow:0 10px 26px rgba(80,55,110,.24)
    }
    .tabs{
      position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.94);
      backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;justify-content:center;z-index:5
    }
    .tabs-inner{width:min(780px,100%);display:grid;grid-template-columns:repeat(3,1fr)}
    .tab{border:0;background:transparent;padding:12px 6px 16px;color:var(--muted)}
    .tab.active{color:var(--accent);font-weight:700}
    .page{display:none}.page.active{display:block}
    .modal{position:fixed;inset:0;background:rgba(38,28,47,.35);display:none;align-items:flex-end;z-index:10}
    .modal.open{display:flex}
    .sheet{width:100%;max-width:780px;margin:auto;background:#fff;border-radius:24px 24px 0 0;padding:20px 18px 26px;max-height:88vh;overflow:auto}
    .sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
    .sheet-head h2{font-size:20px;margin:0}
    .close{border:0;background:var(--accent-soft);color:var(--accent);border-radius:12px;width:36px;height:36px}
    .field{margin-bottom:12px}
    .field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}
    .field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:13px;padding:11px 12px;outline:none;background:#fff;color:var(--text)}
    .field textarea{min-height:82px;resize:vertical}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .actions{display:flex;gap:9px;flex-wrap:wrap}
    .primary,.secondary,.danger{border:0;border-radius:13px;padding:10px 14px}
    .primary{background:var(--accent);color:#fff}.secondary{background:var(--accent-soft);color:var(--accent)}.danger{background:#f9eaea;color:var(--danger)}
    .account{padding:13px 0;border-bottom:1px solid var(--line)}
    .account:last-child{border:0}
    .account-name{font-weight:700}
    .account-role{font-size:12px;color:var(--muted);margin-top:3px}
    .privacy{font-size:12px;color:var(--muted);line-height:1.6}
    @media(max-width:560px){.stats{grid-template-columns:1fr 1fr}.stats .stat:last-child{grid-column:1/-1}.row{grid-template-columns:1fr}}
  </style>
</head>
<body>
<div class="app">
  <div class="top">
    <div>
      <h1>帳號地圖</h1>
      <div class="subtitle">不用再猜「這個平台當初到底綁哪個？」</div>
    </div>
    <button id="installBtn" class="install">安裝 App</button>
  </div>

  <section id="home" class="page active">
    <div class="card">
      <div class="stats">
        <div class="stat"><b id="platformCount">0</b><span>平台紀錄</span></div>
        <div class="stat"><b id="accountCount">0</b><span>Email 身份</span></div>
        <div class="stat"><b id="recentCount">0</b><span>最近 30 天新增</span></div>
      </div>
    </div>
    <div class="card">
      <input id="search" class="search" placeholder="搜尋平台、Email、用途或備註…">
      <div class="chips" id="chips" style="margin-top:12px"></div>
    </div>
    <div class="card">
      <div class="section-title">平台紀錄</div>
      <div id="entryList"></div>
    </div>
  </section>

  <section id="accounts" class="page">
    <div class="card">
      <div class="section-title">我的 Email 身份</div>
      <div id="accountList"></div>
      <button class="secondary" onclick="openAccountModal()" style="margin-top:12px">＋ 新增 Email 身份</button>
    </div>
  </section>

  <section id="settings" class="page">
    <div class="card">
      <div class="section-title">備份與搬家</div>
      <div class="actions">
        <button class="secondary" onclick="exportData()">匯出 JSON</button>
        <label class="secondary" style="display:inline-block">匯入 JSON<input type="file" accept=".json" onchange="importData(event)" style="display:none"></label>
      </div>
      <p class="privacy">資料只存於這個瀏覽器的 localStorage。換手機、清除瀏覽資料前，記得先匯出 JSON。請不要在備註內記錄密碼、OTP 或完整信用卡資料。</p>
    </div>
    <div class="card">
      <div class="section-title">危險區</div>
      <button class="danger" onclick="clearAll()">清除全部平台紀錄</button>
    </div>
  </section>
</div>

<button class="fab" aria-label="新增平台" onclick="openEntryModal()">＋</button>

<nav class="tabs">
  <div class="tabs-inner">
    <button class="tab active" data-page="home">首頁</button>
    <button class="tab" data-page="accounts">Email</button>
    <button class="tab" data-page="settings">設定</button>
  </div>
</nav>

<div id="entryModal" class="modal" onclick="backdropClose(event,'entryModal')">
  <div class="sheet">
    <div class="sheet-head"><h2 id="entryModalTitle">新增平台</h2><button class="close" onclick="closeModal('entryModal')">×</button></div>
    <input type="hidden" id="editId">
    <div class="field"><label>平台名稱</label><input id="platform" placeholder="例如：YouTube、Steam、Shopee"></div>
    <div class="row">
      <div class="field"><label>綁定 Email</label><select id="email"></select></div>
      <div class="field"><label>登入方式</label><select id="login">
        <option>Google 登入</option><option>Email + 密碼</option><option>電話號碼</option><option>Apple 登入</option><option>Facebook 登入</option><option>其他</option>
      </select></div>
    </div>
    <div class="row">
      <div class="field"><label>用途</label><select id="purpose">
        <option>現實 / 正式</option><option>創作 / 公開身份</option><option>遊戲 / 娛樂</option><option>影音 / YouTube</option><option>購物 / 付款</option><option>社群 / 自媒體</option><option>小帳 / 測試</option><option>其他</option>
      </select></div>
      <div class="field"><label>狀態</label><select id="status"><option>常用</option><option>偶爾使用</option><option>歷史保留</option><option>準備停用</option></select></div>
    </div>
    <div class="field"><label>備註</label><textarea id="notes" placeholder="例如：有觀看歷史、曾課金、不可搬家…"></textarea></div>
    <div class="actions"><button class="primary" onclick="saveEntry()">儲存</button><button id="deleteEntryBtn" class="danger" style="display:none" onclick="deleteCurrentEntry()">刪除</button></div>
  </div>
</div>

<div id="accountModal" class="modal" onclick="backdropClose(event,'accountModal')">
  <div class="sheet">
    <div class="sheet-head"><h2>新增 Email 身份</h2><button class="close" onclick="closeModal('accountModal')">×</button></div>
    <div class="field"><label>Email 名稱 / 前綴</label><input id="accountName" placeholder="例如：myname123"></div>
    <div class="field"><label>定位</label><input id="accountRole" placeholder="例如：遊戲 / Google Play / 私人"></div>
    <button class="primary" onclick="saveAccount()">新增</button>
  </div>
</div>

<script>
const DATA_KEY='account-map.entries.v2';
const ACC_KEY='account-map.accounts.v2';
let entries=JSON.parse(localStorage.getItem(DATA_KEY)||'[]');
let accounts=JSON.parse(localStorage.getItem(ACC_KEY)||'[]');
let activeFilter='全部';

function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function persist(){localStorage.setItem(DATA_KEY,JSON.stringify(entries));localStorage.setItem(ACC_KEY,JSON.stringify(accounts))}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fmt(ts){try{return new Date(ts).toLocaleDateString('zh-Hant')}catch{return ''}}

function render(){
  document.getElementById('platformCount').textContent=entries.length;
  document.getElementById('accountCount').textContent=accounts.length;
  const cutoff=Date.now()-30*864e5;
  document.getElementById('recentCount').textContent=entries.filter(x=>(x.createdAt||0)>=cutoff).length;

  const q=document.getElementById('search').value.trim().toLowerCase();
  const filters=['全部',...accounts.map(a=>a.name)];
  document.getElementById('chips').innerHTML=filters.map(f=>`<button class="chip ${activeFilter===f?'active':''}" onclick="setFilter('${esc(f).replace(/'/g,"\\'")}')">${esc(f)}</button>`).join('');

  const list=entries.filter(e=>{
    const hit=!q||JSON.stringify(e).toLowerCase().includes(q);
    const filt=activeFilter==='全部'||e.email===activeFilter;
    return hit&&filt;
  }).sort((a,b)=>(b.updatedAt||b.createdAt||0)-(a.updatedAt||a.createdAt||0));

  document.getElementById('entryList').innerHTML=list.length?list.map(e=>`
    <div class="entry">
      <div class="dot"></div>
      <div class="entry-main">
        <div class="entry-title">${esc(e.platform)}</div>
        <div class="meta">${esc(e.email||'未指定')} · ${esc(e.login)} · ${esc(e.purpose)} · ${esc(e.status)}</div>
        ${e.notes?`<div class="note">${esc(e.notes)}</div>`:''}
        <div class="meta">${fmt(e.updatedAt||e.createdAt)}</div>
      </div>
      <button class="mini" onclick="editEntry('${e.id}')">編輯</button>
    </div>`).join(''):'<div class="empty">目前沒有符合的紀錄。</div>';

  document.getElementById('accountList').innerHTML=accounts.length?accounts.map(a=>{
    const n=entries.filter(e=>e.email===a.name).length;
    return `<div class="account"><div class="account-name">${esc(a.name)} <span class="meta">(${n} 個平台)</span></div><div class="account-role">${esc(a.role||'未設定定位')}</div></div>`;
  }).join(''):'<div class="empty">還沒有 Email 身份。先新增你常用的帳號吧。</div>';

  const sel=document.getElementById('email');
  const current=sel.value;
  sel.innerHTML=accounts.map(a=>`<option>${esc(a.name)}</option>`).join('');
  if([...sel.options].some(o=>o.value===current)) sel.value=current;
}

function setFilter(f){activeFilter=f;render()}
document.getElementById('search').addEventListener('input',render);

document.querySelectorAll('.tab').forEach(btn=>btn.addEventListener('click',()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));
  btn.classList.add('active');document.getElementById(btn.dataset.page).classList.add('active');
}));

function openEntryModal(){
  if(!accounts.length){alert('請先到 Email 頁新增至少一個 Email 身份。');return}
  document.getElementById('entryModalTitle').textContent='新增平台';
  document.getElementById('editId').value='';
  ['platform','notes'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('login').selectedIndex=0;document.getElementById('purpose').selectedIndex=0;document.getElementById('status').selectedIndex=0;
  document.getElementById('deleteEntryBtn').style.display='none';
  render();document.getElementById('entryModal').classList.add('open');
}
function editEntry(id){
  const e=entries.find(x=>x.id===id);if(!e)return;
  document.getElementById('entryModalTitle').textContent='編輯平台';
  document.getElementById('editId').value=e.id;document.getElementById('platform').value=e.platform;document.getElementById('email').value=e.email;
  document.getElementById('login').value=e.login;document.getElementById('purpose').value=e.purpose;document.getElementById('status').value=e.status;document.getElementById('notes').value=e.notes||'';
  document.getElementById('deleteEntryBtn').style.display='inline-block';
  document.getElementById('entryModal').classList.add('open');
}
function saveEntry(){
  const platform=document.getElementById('platform').value.trim();if(!platform){alert('請輸入平台名稱');return}
  const id=document.getElementById('editId').value;
  const data={platform,email:document.getElementById('email').value,login:document.getElementById('login').value,purpose:document.getElementById('purpose').value,status:document.getElementById('status').value,notes:document.getElementById('notes').value.trim(),updatedAt:Date.now()};
  if(id){const i=entries.findIndex(x=>x.id===id);entries[i]={...entries[i],...data}}else{entries.push({id:uid(),createdAt:Date.now(),...data})}
  persist();closeModal('entryModal');render();
}
function deleteCurrentEntry(){
  const id=document.getElementById('editId').value;if(!id||!confirm('確定刪除這筆紀錄？'))return;
  entries=entries.filter(x=>x.id!==id);persist();closeModal('entryModal');render();
}
function openAccountModal(){document.getElementById('accountName').value='';document.getElementById('accountRole').value='';document.getElementById('accountModal').classList.add('open')}
function saveAccount(){
  const name=document.getElementById('accountName').value.trim();const role=document.getElementById('accountRole').value.trim();
  if(!name){alert('請輸入 Email 名稱或前綴');return}
  if(accounts.some(a=>a.name===name)){alert('這個 Email 已經存在');return}
  accounts.push({id:uid(),name,role});persist();closeModal('accountModal');render();
}
function closeModal(id){document.getElementById(id).classList.remove('open')}
function backdropClose(e,id){if(e.target.id===id)closeModal(id)}
function exportData(){
  const data={version:2,exportedAt:new Date().toISOString(),accounts,entries};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='account-map-backup.json';a.click();URL.revokeObjectURL(url);
}
function importData(ev){
  const f=ev.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.accounts)||!Array.isArray(d.entries))throw 0;accounts=d.accounts;entries=d.entries;persist();render();alert('匯入完成')}catch{alert('備份格式不正確')}};
  r.readAsText(f);
}
function clearAll(){if(!confirm('確定清除全部平台紀錄？Email 身份會保留。'))return;entries=[];persist();render()}

let deferredPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;document.getElementById('installBtn').style.display='block'});
document.getElementById('installBtn').addEventListener('click',async()=>{if(!deferredPrompt)return;deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;document.getElementById('installBtn').style.display='none'});
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js'))}
render();
</script>
</body>
</html>
